<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">电偶极子模型</title><desc id="desc">负电荷与正电荷相距 d，偶极矩沿 z 轴；标出任意场点 P、距离 r 和夹角 theta。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#315d9b"/></marker></defs>
  <rect width="900" height="420" fill="#fff"/>
  <line x1="80" y1="260" x2="835" y2="260" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="268" font-family="Arial,sans-serif" font-size="22">z</text>
  <circle cx="315" cy="260" r="24" fill="#3577c8"/><text x="303" y="268" fill="#fff" font-family="Arial,sans-serif" font-size="21">−q</text>
  <circle cx="505" cy="260" r="24" fill="#d64b45"/><text x="494" y="268" fill="#fff" font-family="Arial,sans-serif" font-size="21">+q</text>
  <circle cx="410" cy="260" r="4" fill="#222"/><text x="397" y="290" font-family="Arial,sans-serif" font-size="20">O</text>
  <line x1="335" y1="310" x2="485" y2="310" stroke="#222" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="403" y="338" font-family="Arial,sans-serif" font-size="21">d</text>
  <line x1="340" y1="215" x2="485" y2="215" stroke="#315d9b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="403" y="198" fill="#315d9b" font-family="Arial,sans-serif" font-size="22">p</text>
  <circle cx="675" cy="95" r="7" fill="#111"/><text x="690" y="92" font-family="Arial,sans-serif" font-size="21">P(r, θ)</text>
  <line x1="410" y1="260" x2="675" y2="95" stroke="#777" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="160" font-family="Arial,sans-serif" font-size="21">r</text>
  <path d="M480 260 A70 70 0 0 0 469 223" fill="none" stroke="#d17822" stroke-width="3"/>
  <text x="480" y="235" fill="#b55f12" font-family="Arial,sans-serif" font-size="21">θ</text>
  <line x1="410" y1="30" x2="410" y2="385" stroke="#999" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text x="430" y="55" font-family="Arial,sans-serif" font-size="18">垂直中轴线</text>
</svg>
