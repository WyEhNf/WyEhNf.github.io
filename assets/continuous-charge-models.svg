<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">四种连续带电体模型</title><desc id="desc">均匀带电圆环、圆盘、无限长实心柱体和球体的几何参数、场点和电荷密度。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#315d9b"/></marker></defs>
  <rect width="1000" height="620" fill="#fff"/>
  <line x1="500" y1="20" x2="500" y2="600" stroke="#bbb"/><line x1="20" y1="310" x2="980" y2="310" stroke="#bbb"/>
  <text x="35" y="48" font-family="Arial,sans-serif" font-size="23">(a) 均匀带电圆环</text>
  <ellipse cx="230" cy="165" rx="125" ry="50" fill="none" stroke="#b92d2a" stroke-width="8"/>
  <line x1="230" y1="165" x2="355" y2="165" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="290" y="150" font-family="Arial,sans-serif" font-size="21">a</text>
  <line x1="230" y1="165" x2="230" y2="270" stroke="#777" stroke-width="2"/><circle cx="230" cy="270" r="6"/><text x="245" y="277" font-family="Arial,sans-serif" font-size="20">P(z)</text>
  <text x="345" y="235" font-family="Arial,sans-serif" font-size="20">总电荷 Q</text>
  <text x="535" y="48" font-family="Arial,sans-serif" font-size="23">(b) 均匀带电圆盘</text>
  <ellipse cx="725" cy="170" rx="150" ry="65" fill="#f4c6c3" stroke="#b92d2a" stroke-width="3"/>
  <line x1="725" y1="170" x2="875" y2="170" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="800" y="155" font-family="Arial,sans-serif" font-size="21">R</text>
  <line x1="725" y1="170" x2="725" y2="275" stroke="#777" stroke-width="2"/><circle cx="725" cy="275" r="6"/><text x="740" y="282" font-family="Arial,sans-serif" font-size="20">P(z)</text>
  <text x="835" y="238" font-family="Arial,sans-serif" font-size="20">面密度 σ</text>
  <text x="35" y="345" font-family="Arial,sans-serif" font-size="23">(c) 无限长均匀带电实心柱体</text>
  <ellipse cx="235" cy="400" rx="105" ry="32" fill="#f2cf72" stroke="#8b6c18" stroke-width="3"/>
  <path d="M130 400V550 M340 400V550" stroke="#8b6c18" stroke-width="3"/><ellipse cx="235" cy="550" rx="105" ry="32" fill="#f2cf72" stroke="#8b6c18" stroke-width="3"/>
  <line x1="235" y1="400" x2="340" y2="400" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="286" y="385" font-family="Arial,sans-serif" font-size="21">R</text>
  <line x1="340" y1="475" x2="415" y2="475" stroke="#315d9b" stroke-width="3" marker-end="url(#a)"/><text x="360" y="455" fill="#315d9b" font-family="Arial,sans-serif" font-size="20">E(r)</text>
  <text x="365" y="535" font-family="Arial,sans-serif" font-size="20">体密度 ρ</text>
  <text x="535" y="345" font-family="Arial,sans-serif" font-size="23">(d) 球面 / 均匀带电实心球</text>
  <circle cx="725" cy="470" r="115" fill="#d9e7f7" stroke="#315d9b" stroke-width="3"/>
  <circle cx="725" cy="470" r="5"/><line x1="725" y1="470" x2="840" y2="470" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="780" y="455" font-family="Arial,sans-serif" font-size="21">R</text>
  <line x1="840" y1="470" x2="920" y2="470" stroke="#315d9b" stroke-width="3" marker-end="url(#a)"/><text x="858" y="450" fill="#315d9b" font-family="Arial,sans-serif" font-size="20">E(r)</text>
  <text x="608" y="605" font-family="Arial,sans-serif" font-size="19">球面用 σ；实心球用 ρ</text>
</svg>
