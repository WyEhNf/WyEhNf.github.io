<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">双隧道结单电子岛</title><desc id="desc">小导体岛通过参数为 C1 R1 和 C2 R2 的两个隧道结连接左右电极，并通过栅电容 Cg 耦合栅极。</desc>
  <rect width="900" height="400" fill="#fff"/>
  <rect x="60" y="135" width="155" height="120" rx="8" fill="#d8dde3" stroke="#333" stroke-width="3"/><text x="102" y="203" font-family="Arial,sans-serif" font-size="22">左电极</text>
  <rect x="685" y="135" width="155" height="120" rx="8" fill="#d8dde3" stroke="#333" stroke-width="3"/><text x="727" y="203" font-family="Arial,sans-serif" font-size="22">右电极</text>
  <ellipse cx="450" cy="195" rx="105" ry="68" fill="#f2cf72" stroke="#333" stroke-width="3"/><text x="398" y="188" font-family="Arial,sans-serif" font-size="22">导体岛</text><text x="410" y="220" font-family="Arial,sans-serif" font-size="21">Q = Ne</text>
  <line x1="215" y1="195" x2="320" y2="195" stroke="#333" stroke-width="3"/><line x1="320" y1="165" x2="320" y2="225" stroke="#333" stroke-width="4"/><line x1="337" y1="165" x2="337" y2="225" stroke="#333" stroke-width="4"/><line x1="337" y1="195" x2="345" y2="195" stroke="#333" stroke-width="3"/>
  <text x="270" y="145" font-family="Arial,sans-serif" font-size="20">C₁, R₁</text>
  <line x1="555" y1="195" x2="563" y2="195" stroke="#333" stroke-width="3"/><line x1="563" y1="165" x2="563" y2="225" stroke="#333" stroke-width="4"/><line x1="580" y1="165" x2="580" y2="225" stroke="#333" stroke-width="4"/><line x1="580" y1="195" x2="685" y2="195" stroke="#333" stroke-width="3"/>
  <text x="555" y="145" font-family="Arial,sans-serif" font-size="20">C₂, R₂</text>
  <line x1="450" y1="263" x2="450" y2="292" stroke="#333" stroke-width="3"/><line x1="420" y1="292" x2="480" y2="292" stroke="#333" stroke-width="4"/><line x1="420" y1="309" x2="480" y2="309" stroke="#333" stroke-width="4"/><line x1="450" y1="309" x2="450" y2="355" stroke="#333" stroke-width="3"/>
  <text x="490" y="308" font-family="Arial,sans-serif" font-size="20">C₍g₎</text><text x="422" y="383" font-family="Arial,sans-serif" font-size="21">V₍g₎</text>
</svg>
