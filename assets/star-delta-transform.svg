    <path d="M738 322 l-15 -10 l3 16 l14 -9 z"/>
    <path d="M723 310 l14 6 l5 -15 l-13 9 z"/>
  </g>
  <circle cx="150" cy="225" r="7" fill="#333"/>
  <text x="160" y="240" font-family="Arial,sans-serif" font-size="21">O</text>
  <text x="160" y="95" font-family="Arial,sans-serif" font-size="22">a</text>
  <text x="45" y="365" font-family="Arial,sans-serif" font-size="22">b</text>
