<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">星形与三角形电阻网络的等价变换</title><desc id="desc">左为三臂电阻 Ra、Rb、Rc 的星形网络，右为三角形网络 Rab、Rbc、Rca，两端点 a、b、c 的等效电阻相同。</desc>
