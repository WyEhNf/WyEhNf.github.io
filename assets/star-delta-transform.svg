  <text x="620" y="55" font-family="Arial,sans-serif" font-size="24">三角形（Δ）</text>
  <g stroke="#555" stroke-width="3">
    <line x1="150" y1="90" x2="150" y2="225"/>
    <line x1="70" y1="340" x2="150" y2="225"/>
    <line x1="230" y1="340" x2="150" y2="225"/>
    <line x1="650" y1="90" x2="560" y2="340"/>
    <line x1="560" y1="340" x2="740" y2="340"/>
    <line x1="740" y1="340" x2="650" y2="90"/>
  </g>
  <g fill="none" stroke="#d84b45" stroke-width="4">
