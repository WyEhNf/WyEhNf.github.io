<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">均匀电场中的导体球</title><desc id="desc">半径 a 的导体球位于沿 z 轴的均匀外电场中，表面两端出现异号感应电荷。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#315d9b"/></marker></defs>
  <rect width="900" height="470" fill="#fff"/>
  <g stroke="#315d9b" stroke-width="2.5" marker-end="url(#a)"><line x1="75" y1="75" x2="815" y2="75"/><line x1="75" y1="155" x2="815" y2="155"/><line x1="75" y1="315" x2="815" y2="315"/><line x1="75" y1="395" x2="815" y2="395"/></g>
  <circle cx="445" cy="235" r="145" fill="#d8dde3" stroke="#333" stroke-width="3"/>
  <text x="400" y="240" font-family="Arial,sans-serif" font-size="22">E = 0</text>
  <line x1="445" y1="235" x2="590" y2="235" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="515" y="220" font-family="Arial,sans-serif" font-size="21">a</text>
  <text x="735" y="50" fill="#315d9b" font-family="Arial,sans-serif" font-size="22">E₀</text>
  <g fill="#d64b45" font-family="Arial,sans-serif" font-size="24"><text x="558" y="155">+</text><text x="579" y="195">+</text><text x="585" y="245">+</text><text x="566" y="302">+</text></g>
  <g fill="#3577c8" font-family="Arial,sans-serif" font-size="24"><text x="315" y="155">−</text><text x="292" y="195">−</text><text x="286" y="245">−</text><text x="306" y="302">−</text></g>
  <text x="600" y="345" font-family="Arial,sans-serif" font-size="20">σ(θ)=3ε₀E₀ cosθ</text>
</svg>
